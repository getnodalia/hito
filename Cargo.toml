[workspace]
resolver = "2"
members = [
    "crates/hito-core",
    "crates/hito-protocol",
    "crates/hito-e2e",
    "crates/hito-storage",
    "crates/hito-client",
    "apps/hito-server",
    "apps/hito-desktop",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getnodalia/hito"
authors = ["Nodalia"]

[workspace.dependencies]
hito-core = { path = "crates/hito-core" }
hito-protocol = { path = "crates/hito-protocol" }
hito-e2e = { path = "crates/hito-e2e" }
hito-storage = { path = "crates/hito-storage" }
hito-client = { path = "crates/hito-client" }
hito-server = { path = "apps/hito-server" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "trace", "set-header"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
tempfile = "3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
egui = "0.37"
nodalia-theme = { git = "https://github.com/getnodalia/nodalia-design", rev = "8bb4b7dcbf186644ab606b806569c851056cee2c", features = ["egui", "creator", "enterprise"] }
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
png = "0.17"
openmls = "0.9.2"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
chacha20poly1305 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
