[package]
name = "hito-desktop"
description = "Hito's native desktop client, drawn in the Nodalia Design Language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "hito"
path = "src/main.rs"

[dependencies]
hito-core.workspace = true
hito-protocol.workspace = true
hito-client.workspace = true
eframe.workspace = true
egui.workspace = true
nodalia-theme.workspace = true
nodalia-update = { git = "https://github.com/getnodalia/nodalia-design", rev = "114848a2ff1a7c29c9a5432fb12e955fbe0aeef2", features = ["egui"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
chrono.workspace = true
png.workspace = true
sys-locale = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.19"
# The global menu in the desktop's top bar (src/linux_menu.rs): dbusmenu over the session bus.
zbus = "=5.19.0"

[lints]
workspace = true
