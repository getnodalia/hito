# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and the
# glibc the binaries need for @GLIBC_FLOOR@, and exports VERSION and NFPM_ARCH.
name: hito
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: net
priority: optional
maintainer: ${HITO_MAINTAINER}
vendor: Nodalia
homepage: https://getnodalia.com/hito
license: MIT OR Apache-2.0
description: |-
  Self-hosted, open-source team chat.
  Workspaces, channels, direct messages, threads and reactions on a server you
  run yourself, end-to-end encrypted with MLS. Installs the native desktop app
  (hito). The server is the separate hito-server package.

# The binaries link glibc and libgcc_s. Windowing (X11/Wayland, xkbcommon) and OpenGL are loaded
# at runtime with dlopen, so they aren't ELF NEEDED entries and the package tools can't find them:
# they are listed here.
overrides:
  deb:
    depends:
      - libc6 (>= @GLIBC_FLOOR@)
      - libgcc-s1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libegl1
      - libgl1
    recommends:
      - libegl-mesa0
      - xdg-utils
  rpm:
    # Soname provides rather than package names, so the same requirements resolve on Fedora/RHEL
    # and openSUSE.
    depends:
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)

contents:
  - src: ${STAGE}/usr/bin/hito
    dst: /usr/bin/hito
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
