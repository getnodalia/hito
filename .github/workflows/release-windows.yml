name: Release Windows

# Builds Hito's portable Windows x64 zip (the desktop app and the server), starts both on a clean
# runner (the server answers /healthz), and only then attaches the zip to a GitHub release.
#
# Not signed (no code-signing certificate): SmartScreen warns the first time the files run
# ("More info" > "Run anyway").
#
# "Release from main" (release-auto.yml) runs this with the tag when a version and its notes
# land on main, and publishes the release once every platform is attached. Run it by hand with
# tag=vX.Y.Z to rebuild a release's files; without a tag it only uploads workflow artifacts.

on:
  pull_request:
    paths:
      - "packaging/windows/**"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the packages to, e.g. v0.1.0 (empty: artifacts only)"
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the packages to"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      DIST: ${{ github.workspace }}\dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: ver
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" \r]/, "", $3); print $3; exit }' Cargo.toml)"
          test -n "$version"
          if [[ -n "$TAG" && "${TAG#v}" != "$version" ]]; then
            echo "Tag $TAG does not match Cargo.toml's version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes are written
        if: inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/check-release-notes.sh "$TAG"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows

      - name: Build and package
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - name: Checksums
        shell: pwsh
        working-directory: dist
        run: |
          Get-ChildItem | Format-Table Name, Length
          $lines = Get-ChildItem -File hito-* | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content -Encoding ascii SHA256SUMS-windows
          Get-Content SHA256SUMS-windows

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hito-windows
          path: dist/
          if-no-files-found: error

  smoke:
    # The zip as a user gets it: unpack it, start the app and the server, ask for /healthz.
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hito-windows
          path: dist
      - name: Start the app and the server
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          Set-Location dist
          foreach ($line in Get-Content SHA256SUMS-windows) {
            $hash, $name = $line -split '\s+', 2
            if ((Get-FileHash -Algorithm SHA256 $name).Hash.ToLower() -ne $hash) { throw "checksum mismatch: $name" }
          }
          Expand-Archive "hito-$env:VERSION-windows-x64.zip" -DestinationPath unpacked
          $dir = Join-Path (Get-Location) "unpacked\hito-$env:VERSION-windows-x64"
          # A window app prints only into a redirected handle, so read its version from a file.
          $p = Start-Process (Join-Path $dir 'hito.exe') -ArgumentList '--version' -RedirectStandardOutput app.txt -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "hito.exe --version exited with $($p.ExitCode)" }
          $out = Get-Content app.txt -Raw
          Write-Output $out
          if (-not ($out -match [regex]::Escape("hito $env:VERSION"))) { throw "hito.exe --version does not say $env:VERSION" }
          $out = & (Join-Path $dir 'hito-server.exe') --version
          Write-Output $out
          if (-not ($out -match [regex]::Escape("hito-server $env:VERSION"))) { throw "hito-server.exe --version does not say $env:VERSION" }
          New-Item -ItemType Directory -Force srv | Out-Null
          $env:HITO_BIND = '127.0.0.1:7878'
          $server = Start-Process (Join-Path $dir 'hito-server.exe') -WorkingDirectory srv -RedirectStandardError srv\server.log -PassThru -NoNewWindow
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7878/healthz -TimeoutSec 2
              if ($r.Content -eq 'ok') { Write-Output 'server answered /healthz'; Stop-Process $server; exit 0 }
            } catch { }
            Start-Sleep -Seconds 1
          }
          Get-Content srv\server.log -ErrorAction SilentlyContinue
          throw 'the server did not answer /healthz'

  attach:
    # Nothing reaches a release unless every check above passed.
    needs: [build, smoke]
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            docs/release-notes
            scripts
      - name: Release notes are written
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/check-release-notes.sh "$TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hito-windows
          path: dist
      - name: Attach to the release (a draft, created if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # A tag that already exists must point at the commit this run built. Only a confirmed
          # "not found" lets the run go on; any other lookup failure stops it before an upload.
          status="$(gh api --include "repos/$REPO/git/ref/tags/$TAG" 2>/dev/null | head -n 1 | awk '{print $2}' || true)"
          case "$status" in
            200)
              tagged="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
              if [[ "$tagged" != "$SHA" ]]; then
                echo "Tag $TAG points at $tagged, not at $SHA (the commit built here)" >&2
                exit 1
              fi
              ;;
            404) ;;
            *)
              echo "Could not look up tag $TAG (HTTP status: ${status:-none})" >&2
              exit 1
              ;;
          esac
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --draft --target "$SHA" \
              --title "Hito ${TAG#v}" --notes-file "docs/release-notes/$TAG.md"
          fi
          # Only a draft takes files: --clobber on a published release would swap what people downloaded.
          if [[ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "Release $TAG is already published; not touching its files" >&2
            exit 1
          fi
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
