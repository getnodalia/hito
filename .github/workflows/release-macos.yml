name: Release macOS

# Builds Hito's universal (Apple Silicon + Intel) macOS DMG and the server zip, mounts the DMG
# and starts what it carries, and only then attaches the files to a GitHub release.
#
# Signed ad hoc: Hito has no Apple Developer ID, so macOS asks for confirmation the first time
# the app is opened (right-click > Open).
#
# "Release from main" (release-auto.yml) runs this with the tag when a version and its notes
# land on main, and publishes the release once every platform is attached. Run it by hand with
# tag=vX.Y.Z to rebuild a release's files; without a tag it only uploads workflow artifacts.

on:
  pull_request:
    paths:
      - "packaging/macos/**"
      - ".github/workflows/release-macos.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the packages to, e.g. v0.1.0 (empty: artifacts only)"
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the packages to"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-macos-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          test -n "$version"
          if [[ -n "$TAG" && "${TAG#v}" != "$version" ]]; then
            echo "Tag $TAG does not match Cargo.toml's version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes are written
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/check-release-notes.sh "$TAG"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos

      - name: Link against the macOS 26 SDK
        # AppKit draws the window controls in the style of the SDK the app was linked against:
        # linked against 15, macOS 26 keeps the old ones instead of Liquid Glass. The macOS 15
        # runners carry Xcode 26 beside their default; MACOSX_DEPLOYMENT_TARGET keeps the floor.
        run: |
          xcode=$(
            for candidate in /Applications/Xcode_[0-9]*.app; do
              if [[ -d "$candidate/Contents/Developer" ]]; then
                printf '%s\n' "$candidate"
              fi
            done | awk -F/ '{version=$NF; sub(/^Xcode_/, "", version); if (version+0 >= 26) print}' | sort -V | tail -n 1
          )
          test -n "$xcode" || { echo "no Xcode 26 on this runner" >&2; exit 1; }
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcrun --sdk macosx --show-sdk-version

      - name: Build and package
        run: packaging/macos/package.sh --arch universal

      - name: Checksums
        working-directory: dist
        run: |
          ls -lh
          shasum -a 256 hito-* > SHA256SUMS-macos
          cat SHA256SUMS-macos

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hito-macos
          path: dist/
          if-no-files-found: error

  smoke:
    # The DMG as a user gets it: mount it, check the app, start it and the server on both
    # architectures (Intel through Rosetta), and ask the server for /healthz.
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hito-macos
          path: dist
      - name: Start the app and the server
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          softwareupdate --install-rosetta --agree-to-license
          cd dist
          shasum -a 256 -c SHA256SUMS-macos
          hdiutil attach "hito-$VERSION-macos-universal.dmg" -nobrowse -readonly -mountpoint /Volumes/Hito
          test -f /Volumes/Hito/.background/background.tiff
          test -f /Volumes/Hito/.DS_Store
          app=/Volumes/Hito/Hito.app/Contents/MacOS/Hito
          lipo -archs "$app"
          sdk=$(otool -l "$app" | awk '$1 == "sdk" {print $2; exit}')
          echo "linked against SDK $sdk"
          test "${sdk%%.*}" -ge 26
          "$app" --version | tee version.txt
          arch -x86_64 "$app" --version
          grep -q "hito $VERSION" version.txt
          hdiutil detach /Volumes/Hito
          ditto -x -k "hito-server-$VERSION-macos-universal.zip" server
          server="$PWD/$(find server -name hito-server -type f | head -n 1)"
          arch -x86_64 "$server" --version
          "$server" --version | grep -q "hito-server $VERSION"
          mkdir -p "$RUNNER_TEMP/srv" && cd "$RUNNER_TEMP/srv"
          HITO_BIND=127.0.0.1:7878 "$server" >server.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            if [[ "$(curl -fsS http://127.0.0.1:7878/healthz 2>/dev/null)" == ok ]]; then
              echo "server answered /healthz"
              kill "$pid"
              exit 0
            fi
            sleep 1
          done
          cat server.log
          echo "the server did not answer /healthz" >&2
          exit 1

  attach:
    # Nothing reaches a release unless every check above passed.
    needs: [build, smoke]
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            docs/release-notes
            scripts
      - name: Release notes are written
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/check-release-notes.sh "$TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hito-macos
          path: dist
      - name: Attach to the release (a draft, created if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # A tag that already exists must point at the commit this run built. Only a confirmed
          # "not found" lets the run go on; any other lookup failure stops it before an upload.
          status="$(gh api --include "repos/$REPO/git/ref/tags/$TAG" 2>/dev/null | head -n 1 | awk '{print $2}' || true)"
          case "$status" in
            200)
              tagged="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
              if [[ "$tagged" != "$SHA" ]]; then
                echo "Tag $TAG points at $tagged, not at $SHA (the commit built here)" >&2
                exit 1
              fi
              ;;
            404) ;;
            *)
              echo "Could not look up tag $TAG (HTTP status: ${status:-none})" >&2
              exit 1
              ;;
          esac
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --draft --target "$SHA" \
              --title "Hito ${TAG#v}" --notes-file "docs/release-notes/$TAG.md"
          fi
          # Only a draft takes files: --clobber on a published release would swap what people downloaded.
          if [[ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "Release $TAG is already published; not touching its files" >&2
            exit 1
          fi
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
