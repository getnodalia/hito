name: Release Linux

# Builds Hito's Linux packages (AppImage, .deb, .rpm, .tar.gz), starts both binaries on clean
# distributions (the server answers /healthz), and only then attaches the files to a release.
#
# "Release from main" (release-auto.yml) runs this with the tag when a version and its notes
# land on main, and publishes the release once every platform is attached. Run it by hand with
# tag=vX.Y.Z to rebuild a release's files; without a tag it only uploads workflow artifacts.

on:
  pull_request:
    paths:
      - "packaging/linux/**"
      - "packaging/env.sh"
      - ".github/workflows/release-linux.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the packages to, e.g. v0.1.0 (empty: artifacts only)"
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the packages to"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-linux-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The oldest glibc we build on is the oldest one the packages run on.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          test -n "$version"
          # A tag must describe the code it is built from.
          if [[ -n "$TAG" && "${TAG#v}" != "$version" ]]; then
            echo "Tag $TAG does not match Cargo.toml's version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes are written
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/check-release-notes.sh "$TAG"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev \
            desktop-file-utils appstream zsync
          # nfpm builds the .deb and .rpm; pinned by checksum.
          curl -fsSL --proto '=https' -o nfpm.deb \
            https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_amd64.deb
          echo "4a4402f8f9ea87c669d6a62b333f8e268439974754dd886a01731ecaf9fa6d66  nfpm.deb" | sha256sum -c -
          sudo apt-get install -y ./nfpm.deb
          rm nfpm.deb

      - name: Build and package
        run: packaging/linux/package.sh

      - name: Checksums
        working-directory: dist
        run: |
          ls -lh
          sha256sum hito-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hito-linux
          path: dist/
          if-no-files-found: error

  smoke:
    # Bare distribution images: the AppImage's app and the tarball's server must start with
    # nothing installed but glibc, and the server must answer.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:latest", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hito-linux
          path: dist
      - name: Start the app and the server
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          app="hito-$VERSION-linux-x86_64.AppImage"
          chmod +x "$app"
          # No FUSE in a container: unpack the image and start the binary it carries.
          "./$app" --appimage-extract >/dev/null
          squashfs-root/usr/bin/hito --version | tee version.txt
          grep -q "hito $VERSION" version.txt
          if command -v dnf >/dev/null; then dnf -y install tar gzip shadow-utils util-linux >/dev/null; fi
          # The server tarball's installer, as on a headless machine (no systemd in a container,
          # so it only lays the files out), then the server as its own user with its own config.
          tar -xzf "hito-server-$VERSION-linux-x86_64.tar.gz"
          "./hito-server-$VERSION-linux-x86_64/install.sh"
          getent passwd hito
          test "$(stat -c %U /var/lib/hito)" = hito
          test -f /etc/hito/hito.toml
          server=/usr/local/bin/hito-server
          "$server" --version | grep -q "hito-server $VERSION"
          cd /var/lib/hito
          su -s /bin/sh hito -c "$server --config /etc/hito/hito.toml" >/tmp/server.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            # bash's /dev/tcp: the images have no curl. A refused connection only ends the subshell.
            reply="$( { exec 3<>/dev/tcp/127.0.0.1/7878 \
              && printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 \
              && cat <&3; } 2>/dev/null || true)"
            if [[ "$(tail -n 1 <<<"$reply")" == ok* ]]; then
              echo "server answered /healthz"
              kill "$pid"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/server.log
          echo "the server did not answer /healthz" >&2
          exit 1

      - name: Install the server package
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          # A clean machine for the package: the tarball step above installed by hand.
          rm -rf /etc/hito /usr/local/bin/hito-server
          if command -v apt-get >/dev/null; then
            apt-get update >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y "./hito-server-$VERSION-linux-x86_64.deb"
            # Only the server: none of the desktop's windowing libraries came with it.
            if dpkg -s libxkbcommon0 >/dev/null 2>&1; then
              echo "the server package pulled in desktop libraries" >&2
              exit 1
            fi
          elif command -v dnf >/dev/null; then
            dnf -y install "./hito-server-$VERSION-linux-x86_64.rpm"
          else
            echo "no package manager for this image's packages; the tarball covered it"
            exit 0
          fi
          /usr/bin/hito-server --version | grep -q "hito-server $VERSION"
          test -f /usr/lib/systemd/system/hito-server.service
          test "$(stat -c %G /etc/hito/hito.toml)" = hito
          getent passwd hito

  attach:
    # Nothing reaches a release unless every check above passed.
    needs: [build, smoke]
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            docs/release-notes
            scripts
      - name: Release notes are written
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/check-release-notes.sh "$TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hito-linux
          path: dist
      - name: Attach to the release (a draft, created if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # A tag that already exists must point at the commit this run built. Only a confirmed
          # "not found" lets the run go on; any other lookup failure stops it before an upload.
          status="$(gh api --include "repos/$REPO/git/ref/tags/$TAG" 2>/dev/null | head -n 1 | awk '{print $2}' || true)"
          case "$status" in
            200)
              tagged="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
              if [[ "$tagged" != "$SHA" ]]; then
                echo "Tag $TAG points at $tagged, not at $SHA (the commit built here)" >&2
                exit 1
              fi
              ;;
            404) ;;
            *)
              echo "Could not look up tag $TAG (HTTP status: ${status:-none})" >&2
              exit 1
              ;;
          esac
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --draft --target "$SHA" \
              --title "Hito ${TAG#v}" --notes-file "docs/release-notes/$TAG.md"
          fi
          # Only a draft takes files: --clobber on a published release would swap what people downloaded.
          if [[ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "Release $TAG is already published; not touching its files" >&2
            exit 1
          fi
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
